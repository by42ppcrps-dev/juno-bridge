<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; min-width: 280px; color: #1c1c1e; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34c759; }
  .dot.paused { background: #ff9f0a; }
  .dot.unregistered, .dot.bad { background: #ff453a; }
  .dot.warn { background: #ff9f0a; }
  button { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid #c7c7cc; background: #fff; cursor: pointer; margin-right: 8px; }
  button.primary { background: #007aff; color: #fff; border-color: #007aff; }
  button.danger { background: #ff453a; color: #fff; border-color: #ff453a; }
  .meta { font-size: 12px; color: #6e6e73; margin: 12px 0; word-break: break-all; }
  h2 { font-size: 13px; margin: 16px 0 8px; color: #6e6e73; text-transform: uppercase; letter-spacing: 0.04em; }
  #log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  #log li { padding: 6px 0; border-top: 1px solid #e5e5ea; }
  #log .t { color: #8e8e93; margin-right: 6px; }
  #log .bad { color: #ff453a; }
  #log .good { color: #34c759; }
  #log .err { display: block; color: #8e8e93; margin-top: 2px; }
  .empty { color: #8e8e93; font-size: 12px; }
</style>
</head>
<body>
  <h1>Juno Bridge</h1>
  <div class="status"><span id="dot" class="dot unregistered"></span><span id="statusText">Not registered</span></div>
  <div>
    <button id="toggleBtn" class="primary">Pause</button>
    <button id="optionsBtn">Options</button>
  </div>
  <div class="meta" id="meta"></div>
  <h2>Recent activity</h2>
  <ul id="log"></ul>
  <p class="empty" id="emptyLog" hidden>Nothing yet. Actions Juno takes in this browser will appear here.</p>
  <script src="config.js"></script>
  <script src="panel.js"></script>
</body>
</html>
